# Publishes the packages to JSR through OIDC (each package is linked to this repository on jsr.io).
# Called by the release workflow with its version commit; started by hand (Actions → JSR → Run workflow)
# to publish a release whose JSR step failed, from main while its packages are still that release's.
# Versions already on JSR are skipped.
name: JSR

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to publish
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/jsr.ts
      - name: Publish
        run: |
          for dir in packages/*/; do
            [ -f "$dir/jsr.json" ] || continue
            id=$(node -p 'const j = require(process.argv[1]); j.name + "@" + j.version' "$PWD/$dir/jsr.json")
            if curl -sf "https://jsr.io/${id%@*}/${id##*@}_meta.json" -o /dev/null; then
              echo "$id is already on JSR"
            else
              (cd "$dir" && bunx jsr@0.14.3 publish --allow-dirty --allow-slow-types)
            fi
          done
