name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    # the storage tests run against every engine; same images as test/compose.yml
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: atelier, POSTGRES_PASSWORD: atelier, POSTGRES_DB: atelier }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atelier" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:9.7
        env: { MYSQL_USER: atelier, MYSQL_PASSWORD: atelier, MYSQL_DATABASE: atelier, MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:12.3
        env: { MARIADB_USER: atelier, MARIADB_PASSWORD: atelier, MARIADB_DATABASE: atelier, MARIADB_ROOT_PASSWORD: root }
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
    env:
      ATELIER_TEST_POSTGRES_URL: postgres://atelier:atelier@127.0.0.1:5432/atelier
      ATELIER_TEST_MYSQL_URL: mysql://atelier:atelier@127.0.0.1:3306/atelier
      ATELIER_TEST_MARIADB_URL: mariadb://atelier:atelier@127.0.0.1:3307/atelier
      ATELIER_TEST_S3_URL: http://atelier:atelier-secret@127.0.0.1:9000/atelier
    steps:
      # an S3-compatible server for the S3 storage driver (RustFS: MinIO no longer publishes images; a service
      # container can't be given its command)
      - run: docker run -d -p 9000:9000 -e RUSTFS_ACCESS_KEY=atelier -e RUSTFS_SECRET_KEY=atelier-secret rustfs/rustfs:1.0.4 /data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run licenses
      # known vulnerabilities in what the published packages install (dev tooling isn't shipped)
      # GHSA-mrhx-c7xc-m3w5 (zod <4.6.6): published packages get 4.6.7 (root overrides); only @nuxt/content in
      # the private docs site and UI fixture still has zod 3, which has no fixed release. Drop when it moves to 4.
      # GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS from a crafted extglob pattern): no fixed release yet.
      # No published package uses picomatch; it comes in through build tooling (@nuxt/kit, Vite), which
      # matches the developer's own globs, never a visitor's input. Drop once picomatch has a fixed release.
      - run: bun audit --omit=dev --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5 --ignore=GHSA-fc5q-39xc-vjpf
      - run: bun run deps
      - run: bun run knip
      - run: bun run lint
      # before typecheck and test: the layer and its fixtures load the module's dist/
      - run: bun run build
      - run: bun run typecheck
      # the e2e tests drive Chromium
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run test
      # what a failing test left to look at (the editor's isolation screenshots)
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
      - run: bun run check:pkg
      - run: bun run pack

  # Server response budget (scripts/bench.ts): p95 of a cached page and of an uncached 50-block page, against
  # the budgets and the median of main's last runs (kept in the Actions cache; only main records to it).
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npx nuxi build
        working-directory: test/fixtures/routing
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench/history.json
          key: bench-history-${{ github.run_id }}
          restore-keys: bench-history-
      - run: mkdir -p .bench && bun scripts/bench.ts --history .bench/history.json ${{ github.ref == 'refs/heads/main' && '--record' || '' }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench/history.json
          key: bench-history-${{ github.run_id }}

  # Third-party compatibility, reported without gating merges: nuxt-i18n-micro and @nuxtjs/i18n under
  # compatibilityVersion: 5. Both work there as of 3.30.1 and 10.6.0; this says when a release stops.
  compat:
    name: Compat (i18n modules, Nuxt 5 behaviour)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx vitest run --project compat
        env:
          ATELIER_COMPAT: '1'

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # the docs install the workspace packages, which resolve to their dist/
      - run: bun run build
      # fails on broken internal links (prerender) and unknown MDC components or unreached pages (scripts/check-output.ts)
      - run: bun run docs:build

  # The whole journey (test/e2e/journey.test.ts) in the matrix's other cells: `check` runs it on SQLite with
  # Node 24 and 26; here on each database server, and with Nuxt 5 behaviour (no i18n module there yet).
  journey:
    name: Journey (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: PostgreSQL, database: 'postgres://atelier:atelier@127.0.0.1:5432/atelier' }
          - { name: MySQL, database: 'mysql://atelier:atelier@127.0.0.1:3306/atelier' }
          - { name: MariaDB, database: 'mariadb://atelier:atelier@127.0.0.1:3307/atelier' }
          - { name: Nuxt 5 behaviour, nuxt5: '1' }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: atelier, POSTGRES_PASSWORD: atelier, POSTGRES_DB: atelier }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atelier" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:9.7
        env: { MYSQL_USER: atelier, MYSQL_PASSWORD: atelier, MYSQL_DATABASE: atelier, MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:12.3
        env: { MARIADB_USER: atelier, MARIADB_PASSWORD: atelier, MARIADB_DATABASE: atelier, MARIADB_ROOT_PASSWORD: root }
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
    env:
      ATELIER_JOURNEY_DATABASE_URL: ${{ matrix.database }}
      ATELIER_NUXT5: ${{ matrix.nuxt5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright-core install --with-deps chromium
      - run: bunx vitest run test/e2e

  # The next Nuxt, reported without gating merges: nuxt-nightly@5x in place of the catalog's Nuxt, running the
  # journey and the API and module suites.
  nightly:
    name: Nuxt 5 nightly
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun's workspaces object (with its catalog) isn't npm's: edit it with jq
      - run: jq '.workspaces.catalog.nuxt = "npm:nuxt-nightly@5x"' package.json > package.next.json && mv package.next.json package.json
      - run: bun install
      - run: bun run build
      - run: bunx playwright-core install --with-deps chromium
      - run: bunx vitest run test/e2e test/api test/module
        env:
          ATELIER_NUXT5: '1'

  # TypeScript 7 (the native compiler), reported without gating merges. Vue's language tools v4, which would
  # type-check the .vue files with it, aren't released: until they are, vue-tsc 3 does that in `check`.
  typescript-7:
    name: TypeScript 7
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm install --global typescript@7.0.2
      - run: tsc --version && tsc --noEmit
      - name: Vue language tools v4
        run: |
          npm view vue-tsc@4 version || echo "::notice::Vue language tools v4 aren't released yet, so .vue files are checked with vue-tsc 3 in the check job"

  # A new contributor's setup, from CONTRIBUTING.md's own commands on a clean runner
  contributor:
    name: Contributor setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bunx playwright-core install --with-deps chromium
      # the tests run in `check` (with every database): here, everything else the guide says
      - run: bun scripts/contributor-setup.ts --skip "bun run test"

  # The hosting guides' example files built into an app installed from the packed tarballs, as a new user's
  # app installs from the registry, then run: Node, Bun, Deno, Docker and Compose with PostgreSQL, Workers in
  # Miniflare, and Vercel and Netlify builds (test/deploy).
  deploy:
    name: Deploy smoke tests
    runs-on: ubuntu-latest
    env:
      ATELIER_DEPLOY: '1'
      ATELIER_TEST_S3_URL: http://atelier:atelier-secret@127.0.0.1:9000/atelier
    steps:
      - run: docker run -d -p 9000:9000 -e RUSTFS_ACCESS_KEY=atelier -e RUSTFS_SECRET_KEY=atelier-secret rustfs/rustfs:1.0.4 /data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run pack
      - run: bunx vitest run --project deploy
