name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    # the storage tests run against every engine; same images as test/compose.yml
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: atelier, POSTGRES_PASSWORD: atelier, POSTGRES_DB: atelier }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atelier" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:9.7
        env: { MYSQL_USER: atelier, MYSQL_PASSWORD: atelier, MYSQL_DATABASE: atelier, MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-retries 60
      mariadb:
        image: mariadb:12.3
        env: { MARIADB_USER: atelier, MARIADB_PASSWORD: atelier, MARIADB_DATABASE: atelier, MARIADB_ROOT_PASSWORD: root }
        ports: ['3307:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 60
    env:
      ATELIER_TEST_POSTGRES_URL: postgres://atelier:atelier@127.0.0.1:5432/atelier
      ATELIER_TEST_MYSQL_URL: mysql://atelier:atelier@127.0.0.1:3306/atelier
      ATELIER_TEST_MARIADB_URL: mariadb://atelier:atelier@127.0.0.1:3307/atelier
      ATELIER_TEST_S3_URL: http://atelier:atelier-secret@127.0.0.1:9000/atelier
    steps:
      # MinIO for the S3 storage driver (a service container can't be given its `server` command)
      - run: docker run -d -p 9000:9000 -e MINIO_ROOT_USER=atelier -e MINIO_ROOT_PASSWORD=atelier-secret quay.io/minio/minio:latest server /data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run licenses
      - run: bun run lint
      # before typecheck and test: the layer and its fixtures load the module's dist/
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:pkg
      - run: bun run pack

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # the docs install the workspace packages, which resolve to their dist/
      - run: bun run build
      # fails on broken internal links (prerender) and unknown MDC components or unreached pages (scripts/check-output.ts)
      - run: bun run docs:build
